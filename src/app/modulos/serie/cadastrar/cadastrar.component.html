<mat-card>
  <mat-toolbar color="primary">Cadastrar Serie</mat-toolbar>

  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field>
        <input matInput placeholder="serie" formControlName="nome" #nome />
      </mat-form-field>
    </form>
  </mat-card-content>

  <mat-card-actions class="actions-center">
    <button mat-raised-button color="primary" (click)="onSubmit()">
      Salvar
    </button>
    <button mat-raised-button (click)="onCancel()" class="btn-space">
      Cancelar
    </button>
  </mat-card-actions>
</mat-card>
